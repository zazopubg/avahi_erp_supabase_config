name: avahi
description: "Avahi — Field Operations & Workforce Management Platform (Web/Chrome)."
publish_to: 'none'
version: 0.1.0+1

environment:
  # 🛠 (إصلاح تعارض الحزم) — رُفع الحد الأدنى لإصدار Flutter/Dart SDK.
  # ⚠️ ملاحظة: هذا الرفع وحده لم يكن كافياً لحل التعارض الأصلي (رفع
  # `environment.sdk` هنا يُحدِّد فقط الحد الأدنى المسموح، ولا يُغيّر
  # إصدار Flutter المثبَّت فعلياً على الجهاز — لذا بقيت `matcher`/
  # `test_api` "المثبَّتة" من SDK نفسه كما هي). الحل الفعلي كان في
  # إزالة `freezed`/`freezed_annotation` (انظر `dependencies` أدناه)،
  # لأنهما كانا يفرضان مجال `analyzer` لا يتقاطع مع ما تحتاجه سلسلة
  # `bloc_test`/`test`/`flutter_test`. أُبقي على رفع SDK هنا لأنه غير
  # ضار ومفيد بشكل عام (يمنع استخدام حزم لا تدعم SDK قديماً).
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management (Cubit) ──────────────────────────────
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5

  # ── Backend / Supabase ────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── HTTP (Weather API خارجي — Open-Meteo، Prompt 17) ───────
  http: ^1.2.2

  # ── Local Database (Drift) — Web via WASM/sqlite3 ─────────
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Routing ────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Dependency Injection ───────────────────────────────────
  get_it: ^7.7.0
  injectable: ^2.4.2

  # ── Code Generation Runtime Deps ───────────────────────────
  # 🛠 (إصلاح تعارض الحزم) — أُزيل `freezed`/`freezed_annotation`
  # نهائياً بدل ترقيتهما: `auth_state.dart` (الملف الوحيد الذي استخدم
  # `@freezed` سابقاً) مكتوب فعلياً الآن كـ `sealed class` يدوي (انظر
  # التعليق أعلى الملف نفسه) بعد أن كسر الاعتماد على `.freezed.dart`
  # غير المولَّد عملية `flutter analyze` سابقاً. لا يوجد أي استيراد
  # لـ `package:freezed_annotation` أو أي `part '*.freezed.dart'` في
  # كامل `lib/`/`test/` — الحزمة تبعية ميتة بالكامل، وإبقاؤها كان هو
  # مصدر تعارض `analyzer` مع `bloc_test` دون أي فائدة فعلية. إن احتاج
  # المشروع `freezed` لاحقاً، يُضاف عند الحاجة الفعلية بإصدار 3.x
  # (وليس ^2.5.7) لأنه يدعم مجال `analyzer` أحدث يتوافق مع بقية
  # السلسلة.
  json_annotation: ^4.9.0

  # ── Localization / Intl ────────────────────────────────────
  intl: ^0.20.2

  # ── Utilities ───────────────────────────────────────────────
  uuid: ^4.4.2
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  image: ^4.2.0
  connectivity_plus: ^6.0.3
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  mobile_scanner: ^5.1.1
  signature: ^5.5.0

  # ── Documents (Prompt 21): اختيار/معاينة/طباعة الملفات ─────
  file_picker: ^8.1.3
  printing: ^5.13.4
  url_launcher: ^6.3.1

  # 🆕 (Prompt 27) — Settings: تخزين تفضيلات المستخدم محلياً
  # (`LocalSettingsService`/`SharedPrefsSettingsService`) — وضع
  # القفازات، السمة، مقياس النص، اللغة، تفضيلات المزامنة/الإشعارات.
  shared_preferences: ^2.3.2

  # 🆕 (Prompt 25) — Analytics: توليد ملفات PDF فعلية
  # (`AnalyticsCubit._buildDashboardPdfBytes`)، بخلاف `printing` أعلاه
  # (Prompt 21) المستخدَمة فقط لمعاينة/طباعة PDF جاهز (`PdfPreview`/
  # `Printing.layoutPdf`) — `pdf` كانت أصلاً تبعية عابرة (Transitive)
  # ضمن `printing` نفسها، لكن استيراد `package:pdf/widgets.dart`
  # مباشرة من كود التطبيق (`analytics_cubit.dart`) يتطلب إعلانها
  # صراحة هنا بدل الاعتماد الضمني على حل `pubspec.lock` لتبعية غير
  # معلَنة مباشرة.
  pdf: ^3.11.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation (build_runner chain) ───────────────────
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  drift_dev: ^2.18.0

  # 🆕 (Prompt 29) — طبقة `test/` الشاملة: محاكاة (Mocks) خفيفة عبر
  # `mocktail` (بلا Code Generation، بخلاف `mockito`) لكل من
  # `domain/repositories/` (Interfaces) و`data/sync/` (`OutboxQueue`/
  # `OutboxProcessor`/`NetworkMonitor` — صفوف عادية (Concrete)
  # تُموَّه هنا عبر `extends Mock implements X`، نمط قياسي في
  # `mocktail` لا يستدعي مُنشئ [X] الفعلي إطلاقاً)، و`bloc_test`
  # لاختبار `Cubit`s (`blocTest`/`MockCubit`/`whenListen` — تُستخدم في
  # `widget/features/` لتزويد `BlocProvider` بحالة ثابتة دون حقن كامل
  # سلسلة `UseCase`/`Repository` الحقيقية لكل ودجة عرض).
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/empty_states/
    - assets/icons/svg/
    - assets/animations/
    - assets/l10n/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBM-Plex-Sans-Arabic-Bold.ttf
          weight: 700

# ── ملاحظات ───────────────────────────────────────────────────
# - المشروع يستهدف الويب (Chrome) حصراً في هذه المرحلة.
#   لا تُنشأ أو تُعدَّل مجلدات android/ios/windows/macos/linux.
# - drift + sqlite3 يعملان على الويب عبر WASM (sqlite3.wasm) الذي
#   سيتم تحميله لاحقاً ضمن web/ عند إعداد lib/data/local (Prompt 08).
# - توليد الأكواد (json_serializable / injectable / drift)
#   يُشغَّل عبر: `make gen` أو `dart run build_runner build`.
